<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grab</title>
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grab">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#0d0f14; --card:#161a22; --card2:#1d222c; --line:#272d39;
  --text:#eef1f6; --dim:#8a93a6; --accent:#ff8a3d; --accent2:#ffb36b; --ok:#3ddc97; --bad:#ff5a6a;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,sans-serif}
body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px)}
header{display:flex;align-items:center;gap:10px;margin:6px 2px 18px}
.logo{width:40px;height:40px;border-radius:11px;display:block}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:.3px}
.sub{color:var(--dim);font-size:13px;margin-top:2px}

.search{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;display:flex;gap:6px;align-items:center}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:10px 10px;direction:ltr;text-align:left}
.search input::placeholder{color:#5c6476}
.btn{border:0;font:inherit;font-weight:600;border-radius:13px;padding:11px 16px;font-size:15px;cursor:pointer;color:#1a0f05;background:linear-gradient(135deg,var(--accent2),var(--accent));white-space:nowrap}
.btn:disabled{opacity:.5}
.ghost{background:var(--card2);color:var(--text)}
.icon-btn{background:transparent;border:0;color:var(--dim);padding:8px;cursor:pointer;border-radius:10px}
.icon-btn svg{width:20px;height:20px;display:block}

.status{color:var(--dim);font-size:14px;text-align:center;margin:28px 0}
.err{color:var(--bad)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}

.bar{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px;gap:8px}
.site{font-size:14px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site b{color:var(--text);font-weight:600}
.link{background:0;border:0;color:var(--accent2);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:4px 2px;white-space:nowrap}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--dim);font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}
.cell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:
  repeating-conic-gradient(#1b1f28 0 25%, #20252f 0 50%) 50%/16px 16px;cursor:pointer;outline:2px solid transparent;transition:outline-color .15s, transform .15s}
.cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.cell img.ok{opacity:1}
.cell.sel{outline-color:var(--accent)}
.cell:active{transform:scale(.97)}
.check{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:grid;place-items:center}
.cell.sel .check{background:var(--accent);border-color:var(--accent)}
.check svg{width:12px;height:12px;opacity:0}
.cell.sel .check svg{opacity:1}
.dim{position:absolute;bottom:5px;right:5px;font-size:10px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px;direction:ltr;color:#dfe3ea}

.dock{position:fixed;inset:auto 0 0 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:8px}
.dock .btn{flex:1;padding:15px;font-size:16px}
.dock.hide{display:none}
.progress{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);height:4px;background:var(--line);border-radius:4px;overflow:hidden;display:none}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

.empty{margin-top:40px;text-align:center;color:var(--dim);font-size:14px;line-height:1.7}
.empty svg{width:56px;height:56px;opacity:.35;margin-bottom:8px}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%) translateY(-120%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;transition:transform .25s;z-index:9;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <img class="logo" src="/icon-180.png" alt="">
  <div><h1>Grab</h1><div class="sub">כל התמונות מכל אתר</div></div>
</header>

<form class="search" id="form">
  <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://example.com">
  <button type="button" class="icon-btn" id="paste" title="הדבק"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
  <button class="btn" id="go">סרוק</button>
</form>

<div id="out">
  <div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
    <div>הדבק כתובת של אתר ולחץ סרוק.<br>אפשר לבחור תמונות ולשמור אותן לאפליקציית קבצים.</div>
  </div>
</div>

<div class="progress" id="prog"><i></i></div>
<div class="dock hide" id="dock">
  <button class="btn ghost" id="saveFiles">שמור לקבצים</button>
  <button class="btn" id="saveZip">הורד ZIP</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const state = { page:'', title:'', items:[], filter:'all', type:'all' };
const proxied = (u) => '/api/img?url=' + encodeURIComponent(u) + '&ref=' + encodeURIComponent(state.page);

function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms); }

$('#paste').onclick = async () => {
  try { const t = await navigator.clipboard.readText(); if (t) { $('#url').value = t.trim(); $('#url').focus(); } }
  catch { toast('אין הרשאה ללוח - הדבק ידנית'); }
};

$('#form').onsubmit = (e) => { e.preventDefault(); scan(); };

async function scan(){
  const url = $('#url').value.trim();
  if (!url) return toast('הכנס כתובת');
  history.replaceState(null,'','?url='+encodeURIComponent(url));
  $('#go').disabled = true; $('#dock').classList.add('hide');
  $('#out').innerHTML = '<div class="status"><div class="spinner"></div>סורק את האתר...</div>';
  try{
    const r = await fetch('/api/scan?url=' + encodeURIComponent(url));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'שגיאה');
    state.page = j.page; state.title = j.title;
    state.items = j.images.map((x,i)=>({ ...x, id:i, w:0, h:0, ok:false, failed:false, sel:true }));
    render();
  }catch(e){
    $('#out').innerHTML = '<div class="status err">'+esc(e.message)+'</div>';
  }finally{ $('#go').disabled = false; }
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function extOf(u){ const m = u.split('?')[0].match(/\.([a-z0-9]{2,5})$/i); const e = m ? m[1].toLowerCase() : ''; return e==='jpeg'?'jpg':e; }

const SIZES = [['all','הכל',0],['m','מעל 150px',150],['l','מעל 400px',400],['xl','מעל 1000px',1000]];
const TYPES = [['all','כל הסוגים'],['jpg','JPG'],['png','PNG'],['webp','WebP'],['gif','GIF'],['svg','SVG']];

function visible(){
  const min = SIZES.find(s=>s[0]===state.filter)[2];
  return state.items.filter(it => !it.failed &&
    (min===0 || (it.ok && Math.max(it.w,it.h) >= min)) &&
    (state.type==='all' || extOf(it.url)===state.type || (it.mime||'').includes(state.type)));
}

function render(){
  if (!state.items.length){
    $('#out').innerHTML = '<div class="status">לא נמצאו תמונות בדף הזה.<br><small>ייתכן שהאתר טוען תמונות רק דרך JavaScript.</small></div>';
    return;
  }
  const host = (()=>{ try{return new URL(state.page).hostname}catch{return ''} })();
  $('#out').innerHTML = `
    <div class="bar"><div class="site"><b id="count"></b> · ${esc(host)}</div><button class="link" id="toggleAll"></button></div>
    <div class="chips" id="sizes">${SIZES.map(s=>`<button class="chip" data-v="${s[0]}">${s[1]}</button>`).join('')}</div>
    <div class="chips" id="types">${TYPES.map(s=>`<button class="chip" data-v="${s[0]}">${s[1]}</button>`).join('')}</div>
    <div class="grid" id="grid"></div>`;
  $('#sizes').onclick = e => { const v=e.target.dataset.v; if(v){ state.filter=v; ready=null; refresh(); } };
  $('#types').onclick = e => { const v=e.target.dataset.v; if(v){ state.type=v; ready=null; refresh(); } };
  $('#toggleAll').onclick = () => { const vis=visible(); const all=vis.every(i=>i.sel); vis.forEach(i=>i.sel=!all); ready=null; refresh(); };

  const grid = $('#grid');
  for (const it of state.items){
    const c = document.createElement('div');
    c.className = 'cell'; c.dataset.id = it.id;
    c.innerHTML = `<img alt="" decoding="async"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div><div class="dim"></div>`;
    const img = c.querySelector('img');
    img.onload = () => { it.ok=true; it.w=img.naturalWidth; it.h=img.naturalHeight; img.classList.add('ok');
      c.querySelector('.dim').textContent = it.w && it.h ? it.w+'×'+it.h : extOf(it.url).toUpperCase();
      if (it.w && it.h && it.w*it.h < 400) { it.failed = true; } // tracking pixels
      refresh(); };
    img.onerror = () => { it.failed = true; refresh(); };
    img.src = proxied(it.url);
    c.onclick = () => { it.sel = !it.sel; ready = null; refresh(); };
    it.el = c; grid.appendChild(c);
  }
  refresh();
}

let rq;
function refresh(){ cancelAnimationFrame(rq); rq = requestAnimationFrame(_refresh); }
function _refresh(){
  const vis = new Set(visible());
  for (const it of state.items){ if(!it.el) continue; it.el.style.display = vis.has(it) ? '' : 'none'; it.el.classList.toggle('sel', it.sel); }
  const chosen = [...vis].filter(i=>i.sel);
  const pending = state.items.filter(i=>!i.ok && !i.failed).length;
  $('#count').textContent = `${vis.size} תמונות` + (pending ? ` (טוען ${pending})` : '');
  $('#toggleAll').textContent = [...vis].every(i=>i.sel) && vis.size ? 'בטל הכל' : 'בחר הכל';
  document.querySelectorAll('#sizes .chip').forEach(b=>b.classList.toggle('on', b.dataset.v===state.filter));
  document.querySelectorAll('#types .chip').forEach(b=>b.classList.toggle('on', b.dataset.v===state.type));
  $('#dock').classList.toggle('hide', !chosen.length);
  if (!busy && !ready){
    $('#saveFiles').textContent = `שמור לקבצים (${chosen.length})`;
    $('#saveZip').textContent = 'הורד ZIP';
  }
}

/* ---------- downloading ---------- */
const MIME_EXT = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg','image/avif':'avif','image/x-icon':'ico','image/vnd.microsoft.icon':'ico','image/bmp':'bmp','image/heic':'heic'};
let busy = false, ready = null;

function nameFor(it, blob, used){
  let base = decodeURIComponent((new URL(it.url).pathname.split('/').pop() || 'image')).replace(/\.[a-z0-9]{2,5}$/i,'');
  base = base.replace(/[\\/:*?"<>|]+/g,'_').slice(0,60) || 'image';
  const ext = MIME_EXT[blob.type] || extOf(it.url) || 'jpg';
  let n = `${base}.${ext}`, k = 2;
  while (used.has(n.toLowerCase())) n = `${base}-${k++}.${ext}`;
  used.add(n.toLowerCase()); return n;
}

async function collect(){
  const list = visible().filter(i=>i.sel);
  const used = new Set(); const files = []; let done = 0;
  const bar = $('#prog'), fill = bar.firstElementChild; bar.style.display='block'; fill.style.width='0';
  const queue = [...list];
  async function worker(){
    while(queue.length){
      const it = queue.shift();
      try{
        const r = await fetch(proxied(it.url)); if(!r.ok) throw 0;
        const b = await r.blob();
        files.push({ it, file: new File([b], nameFor(it, b, used), { type: b.type || 'image/jpeg' }) });
      }catch{}
      done++; fill.style.width = (done/list.length*100)+'%';
    }
  }
  await Promise.all(Array.from({length:5}, worker));
  files.sort((a,b)=>a.it.id-b.it.id);
  setTimeout(()=>bar.style.display='none', 400);
  return files.map(f=>f.file);
}

function zipName(){
  let h = 'images'; try{ h = new URL(state.page).hostname.replace(/^www\./,''); }catch{}
  return h + '-images.zip';
}

async function share(files){
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); return true; }
    catch(e){ if (e.name === 'AbortError') return true; }
  }
  return false;
}
function download(file){
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 30000);
}

// Two-tap flow: first tap prepares, second tap opens the iOS share sheet ("שמור בקבצים").
async function action(kind){
  const btn = kind==='zip' ? $('#saveZip') : $('#saveFiles');
  if (ready && ready.kind===kind){
    const files = ready.files; ready = null; refresh();
    if (!(await share(files))) files.forEach(download);
    return;
  }
  if (busy) return;
  busy = true; ready = null; btn.disabled = true; btn.textContent = 'מכין...';
  try{
    const imgs = await collect();
    if (!imgs.length) throw new Error('לא הצלחתי להוריד את התמונות');
    let files = imgs;
    if (kind==='zip'){
      btn.textContent = 'דוחס...';
      const zip = new JSZip(); imgs.forEach(f=>zip.file(f.name, f));
      const blob = await zip.generateAsync({ type:'blob', compression:'STORE' });
      files = [ new File([blob], zipName(), { type:'application/zip' }) ];
    }
    if (imgs.length < visible().filter(i=>i.sel).length) toast(`${imgs.length} תמונות הורדו, חלק נכשלו`);
    ready = { kind, files };
    busy = false; btn.disabled = false;
    btn.textContent = kind==='zip' ? 'מוכן - לחץ לשמירה' : `מוכן - לחץ לשמירה (${imgs.length})`;
  }catch(e){
    busy = false; btn.disabled = false; toast(e.message); refresh();
  }
}
$('#saveFiles').onclick = () => action('files');
$('#saveZip').onclick = () => action('zip');

// open with ?url=
const q = new URLSearchParams(location.search).get('url');
if (q){ $('#url').value = q; scan(); }
</script>
</body>
</html>
